mcs.metadata:
  componentName: Konversationsboosting
  description: Erstellen Sie generative Antworten aus Wissensquellen.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  priority: -1
  actions:
    - kind: SearchAndSummarizeContent
      id: search-content
      variable: Topic.Answer
      userInput: =System.Activity.Text
      additionalInstructions: Beantworte die Frage nur mit Informationen aus dem Fehlerkatalog. Wenn der Katalog die Frage nicht beantwortet, sag das und erfinde nichts. Antworte auf Deutsch, kurz und per du.

    - kind: ConditionGroup
      id: has-answer-conditions
      conditions:
        - id: has-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: EndDialog
              id: end-topic
              clearTopicQueue: true